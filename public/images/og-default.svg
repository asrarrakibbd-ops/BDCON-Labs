    <path d="M25 21H42C48 21 52 25 52 30C52 35 48 39 42 39H25V21Z" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />
    <path d="M25 39H44C50 39 54 43 54 48C54 53 50 58 44 58H25V39Z" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />
